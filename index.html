<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner - AI Itinerary Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .budget-card input:checked + .budget-label { border-color: #6366f1; background-color: #eef2ff; }
        .type-chip input:checked + .type-label { border-color: #6366f1; background-color: #eef2ff; color: #3730a3; }
        #apiKeyPanel { max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s ease-out; }
        #apiKeyPanel.open { max-height: 220px; opacity: 1; }
        #gearBtn.active svg { transform: rotate(60deg); transition: transform 0.3s; }
        #flightSvg { overflow: visible; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-2xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl" aria-hidden="true">✈️</span>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Travel Planner</h1>
                    <p class="text-xs text-slate-500">AI-powered itinerary generator</p>
                </div>
            </div>
            <button id="gearBtn" class="p-2 hover:bg-slate-100 rounded-full transition-all" type="button" aria-label="Open API key settings">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
            </button>
        </div>
        <div id="apiKeyPanel" class="max-w-2xl mx-auto px-4">
            <div class="bg-slate-100 p-4 rounded-xl mb-4">
                <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key" class="w-full p-2 rounded-lg border border-slate-300 text-sm mb-2">
                <button id="saveKeyBtn" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium w-full" type="button">Save Key</button>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">
        <div id="errorBanner" class="hidden mb-6 bg-red-50 border border-red-200 p-4 rounded-xl flex justify-between items-center text-red-700">
            <span id="errorMessage"></span>
            <button type="button" onclick="document.getElementById('errorBanner').classList.add('hidden')" aria-label="Dismiss error">✕</button>
        </div>

        <div id="formContainer" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold mb-1">Plan Your Trip</h2>
            <p class="text-slate-500 text-sm mb-6">Fill in the details to get a personalised day-by-day itinerary</p>

            <form id="tripForm" novalidate>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">Destination*</label><input id="dest" type="text" placeholder="e.g. Munnar, Paris" class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">Starting City*</label><input id="start" type="text" placeholder="e.g. Kochi, Delhi" class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 text-sm"></div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">Days (1-30)*</label><input id="days" type="number" min="1" max="30" class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 text-sm"></div>
                    <div><label class="block text-xs font-semibold text-slate-700 mb-1">Group Size*</label><input id="guests" type="number" min="1" max="20" class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 text-sm"></div>
                </div>

                <label class="block text-xs font-semibold text-slate-700 mb-3">Budget Level*</label>
                <div class="grid grid-cols-3 gap-2 mb-6">
                    <label class="budget-card cursor-pointer"><input type="radio" name="budget" value="Low" class="sr-only"><div class="budget-label p-3 border rounded-xl text-center text-[10px] sm:text-xs">Low<br><span class="text-[9px] text-slate-400 mt-1 block">~₹1k-2k/day</span></div></label>
                    <label class="budget-card cursor-pointer"><input type="radio" name="budget" value="Medium" class="sr-only"><div class="budget-label p-3 border rounded-xl text-center text-[10px] sm:text-xs">Medium<br><span class="text-[9px] text-slate-400 mt-1 block">~₹3k-6k/day</span></div></label>
                    <label class="budget-card cursor-pointer"><input type="radio" name="budget" value="High" class="sr-only"><div class="budget-label p-3 border rounded-xl text-center text-[10px] sm:text-xs">High<br><span class="text-[9px] text-slate-400 mt-1 block">~₹8k+/day</span></div></label>
                </div>

                <label class="block text-xs font-semibold text-slate-700 mb-3">Trip Type (Optional)</label>
                <div id="typeChipContainer" class="flex flex-wrap gap-2 mb-8"></div>

                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 transition">Plan My Trip →</button>
            </form>
        </div>

        <div id="loader" class="hidden bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center">
            <svg id="flightSvg" viewBox="0 0 320 110" class="w-full h-32 mb-6">
                <path id="flightPath" d="M 24 88 C 90 75, 200 18, 300 12" fill="none" stroke="#e2e8f0" stroke-dasharray="6 4" stroke-width="2"/>
                <g id="plane" opacity="0" style="transform-box:fill-box; transform-origin:50% 50%">
                    <ellipse rx="13" ry="3.5" fill="#6366f1"/>
                    <path d="M10 0 L20 0 L15 -10 Z" fill="#4f46e5"/>
                    <path d="M-5 -2 L-5 -10 L5 -2 Z" fill="#818cf8"/>
                    <path d="M-5 2 L-5 10 L5 2 Z" fill="#818cf8"/>
                </g>
            </svg>
            <p class="font-semibold text-indigo-600">Crafting your perfect itinerary...</p>
        </div>

        <div id="output" class="hidden space-y-6">
            <div id="resultContent"></div>
            <button onclick="location.reload()" class="w-full bg-slate-800 text-white py-3 rounded-xl text-sm font-medium hover:bg-slate-900" type="button">Plan Another Trip</button>
        </div>
    </main>

    <script>
        let apiKey = localStorage.getItem('geminiApiKey') || '';

        const types = ['Adventure', 'Cultural', 'Relaxation', 'Family', 'Honeymoon'];
        const icons = {'Adventure': '🧗', 'Cultural': '🏛', 'Relaxation': '🏖', 'Family': '👨‍👩‍👧', 'Honeymoon': '💑'};
        const container = document.getElementById('typeChipContainer');
        types.forEach(type => {
            const label = document.createElement('label');
            label.className = 'type-chip cursor-pointer';
            label.innerHTML = `<input type="radio" name="type" value="${type}" class="sr-only"><div class="type-label px-4 py-2 rounded-full border border-slate-200 text-xs">${icons[type]} ${type}</div>`;
            container.appendChild(label);
        });

        document.getElementById('apiKeyInput').value = apiKey;

        document.getElementById('gearBtn').onclick = () => {
            document.getElementById('apiKeyPanel').classList.toggle('open');
            document.getElementById('gearBtn').classList.toggle('active');
        };

        document.getElementById('saveKeyBtn').onclick = () => {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (val) {
                apiKey = val;
                localStorage.setItem('geminiApiKey', val);
            }
            document.getElementById('apiKeyPanel').classList.remove('open');
            document.getElementById('gearBtn').classList.remove('active');
        };

        document.getElementById('tripForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = {
                dest: document.getElementById('dest').value.trim(),
                start: document.getElementById('start').value.trim(),
                days: document.getElementById('days').value,
                members: document.getElementById('guests').value,
                budget: document.querySelector('input[name="budget"]:checked')?.value,
                type: document.querySelector('input[name="type"]:checked')?.value || 'General'
            };

            if (!apiKey) {
                showError("Please add your Gemini API key in settings first.");
                return;
            }

            if(!formData.dest || !formData.start || !formData.days || !formData.members || !formData.budget) {
                showError("Please fill in all required fields.");
                return;
            }

            showLoading();
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents:[{ parts:[{ text: `Create a ${formData.days}-day trip itinerary from ${formData.start} to ${formData.dest}. Group: ${formData.members} people, Budget: ${formData.budget}, Style: ${formData.type}. Return ONLY JSON: {"summary": "...", "days":[{"day": 1, "title": "...", "morning": ["..."], "afternoon": ["..."], "evening":["..."]}], "tips": ["..."]}` }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error?.message || 'Gemini request failed');
                }
                const itinerary = JSON.parse(data.candidates[0].content.parts[0].text);
                renderItinerary(itinerary);
                hideLoading();
            } catch(err) {
                hideLoading();
                showError("Failed to generate. Please check your API key.");
            }
        };

        function showLoading() {
            document.getElementById('formContainer').classList.add('hidden');
            document.getElementById('output').classList.add('hidden');
            document.getElementById('loader').classList.remove('hidden');
            gsap.registerPlugin(MotionPathPlugin);
            gsap.killTweensOf("#plane");
            gsap.timeline({repeat: -1})
                .set("#plane", {opacity: 1})
                .to("#plane", {motionPath: {path: "#flightPath", autoRotate: true}, duration: 2.8, ease: "power1.inOut"})
                .to("#plane", {opacity: 0, duration: 0.3}, "-=0.3");
        }

        function hideLoading() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('output').classList.remove('hidden');
        }

        function showError(msg) {
            document.getElementById('errorBanner').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = msg;
        }

        function renderItinerary(data) {
            document.getElementById('resultContent').innerHTML = `
                <div class="bg-sky-50 border border-sky-200 p-4 rounded-xl text-sky-800 text-sm mb-6">${data.summary || ''}</div>
                ${(data.days || []).map(d => `
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 mb-6">
                        <div class="font-bold text-lg mb-4 text-indigo-900">Day ${d.day}: ${d.title || 'Adventure'}</div>
                        ${['morning','afternoon','evening'].map(s => d[s] && d[s].length ? `
                            <div class="mb-4">
                                <div class="text-[10px] font-bold uppercase text-slate-400 mb-1">${s}</div>
                                <ul class="list-disc pl-4 text-sm text-slate-600">${d[s].map(i => `<li>${i}</li>`).join('')}</ul>
                            </div>
                        ` : '').join('')}
                    </div>
                `).join('')}
            `;
        }
    </script>
</body>
</html>
